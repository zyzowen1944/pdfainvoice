server {
    listen 443 ssl;
    server_name invoice-parser.example.com;  # Change to your domain name

    # SSL configuration
    ssl_certificate     /etc/nginx/ssl/invoice-parser.crt;
    ssl_certificate_key /etc/nginx/ssl/invoice-parser.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Access and error logs
    access_log /var/log/nginx/invoice-parser-access.log;
    error_log /var/log/nginx/invoice-parser-error.log;

    # Main application
    location / {
        root /var/www/invoice-parser/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy configuration
    location /api/v1/ {
        proxy_pass http://localhost:8999/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running parsing operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Handle large file uploads for PDFs
    client_max_body_size 12M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;
}