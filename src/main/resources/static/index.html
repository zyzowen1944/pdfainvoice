<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票解析测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 20px;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #dee2e6;
            border-radius: 5px;
            text-align: center;
        }
        .upload-section.dragover {
            background-color: #e9ecef;
        }
        .result-section {
            margin-top: 30px;
        }
        .result-area {
            min-height: 300px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: #f8f9fa;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
        .invoice-details {
            margin-top: 20px;
        }
        .progress {
            height: 5px;
            margin-top: 10px;
            display: none;
        }
        .loading-spinner {
            display: none;
            margin: 0 auto;
            width: 50px;
            height: 50px;
        }
        .error-message {
            color: #dc3545;
            margin-top: 10px;
            display: none;
        }
        .file-info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="text-center">发票解析测试系统</h1>
        <p class="text-center text-muted">
            基于金融税务模型智谱AI-THUDM/GLM-4-9B-0414 与 PDFBox解析整合方案的 PDF发票解读组件<br>
            支持多种发票类型的自动解析，包括增值税专用发票、普通发票、电子发票等

        </p>
    </div>

    <div class="upload-section" id="dropArea">
        <h4>上传发票PDF文件</h4>
        <p>点击选择文件或拖拽文件到这里</p>
        <form id="uploadForm">
            <div class="mb-3">
                <input class="form-control" type="file" id="fileInput" accept=".pdf">
                <div class="file-info" id="fileInfo"></div>
                <div class="progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
            <button type="button" class="btn btn-primary" id="parseBtn">解析发票</button>
            <button type="button" class="btn btn-secondary" id="clearBtn">清除</button>
        </form>
        <div class="loading-spinner spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="result-section">
        <h4>解析结果</h4>
        <ul class="nav nav-tabs" id="resultTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="json-tab" data-bs-toggle="tab" data-bs-target="#json" type="button" role="tab">JSON 数据</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="formatted-tab" data-bs-toggle="tab" data-bs-target="#formatted" type="button" role="tab">格式化视图</button>
            </li>
        </ul>
        <div class="tab-content" id="resultTabContent">
            <div class="tab-pane fade show active" id="json" role="tabpanel">
                <pre class="result-area" id="resultJson"></pre>
            </div>
            <div class="tab-pane fade" id="formatted" role="tabpanel">
                <div class="invoice-details" id="invoiceDetails">
                    <div class="alert alert-info">
                        请上传发票PDF文件并点击"解析发票"按钮查看结果
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const parseBtn = document.getElementById('parseBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultJson = document.getElementById('resultJson');
        const invoiceDetails = document.getElementById('invoiceDetails');
        const progressBar = document.querySelector('.progress-bar');
        const progress = document.querySelector('.progress');
        const loadingSpinner = document.querySelector('.loading-spinner');
        const errorMessage = document.getElementById('errorMessage');

        // 拖拽文件处理
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('dragover');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                updateFileInfo();
            }
        });

        fileInput.addEventListener('change', updateFileInfo);

        function updateFileInfo() {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileSizeInMB = (file.size / (1024 * 1024)).toFixed(2);
                fileInfo.textContent = `文件名: ${file.name} | 大小: ${fileSizeInMB} MB`;
                fileInfo.style.display = 'block';
            } else {
                fileInfo.style.display = 'none';
            }
        }

        // 解析发票
        parseBtn.addEventListener('click', () => {
            if (fileInput.files.length === 0) {
                showError('请选择发票PDF文件');
                return;
            }

            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                showError('请选择PDF格式的文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // 显示进度条和加载动画
            progress.style.display = 'block';
            loadingSpinner.style.display = 'block';
            errorMessage.style.display = 'none';
            progressBar.style.width = '0%';
            resultJson.textContent = '';
            invoiceDetails.innerHTML = '<div class="alert alert-info">正在解析中，请稍候...</div>';

            // 模拟上传进度
            let progressValue = 0;
            const progressInterval = setInterval(() => {
                progressValue += 5;
                if (progressValue > 90) {
                    clearInterval(progressInterval);
                }
                progressBar.style.width = `${progressValue}%`;
            }, 100);

            // 发送请求
            fetch('/api/v1/invoice/parse', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';

                    if (!response.ok) {
                        return response.json().then(data => {
                            throw new Error(data.message || '发票解析失败');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    // 显示JSON结果
                    resultJson.textContent = JSON.stringify(data, null, 2);

                    // 显示格式化视图
                    if (data.code === 0 && data.data) {
                        displayFormattedInvoice(data.data);
                    } else {
                        invoiceDetails.innerHTML = `<div class="alert alert-warning">
                            ${data.message || '未能获取发票详情'}
                        </div>`;
                    }
                })
                .catch(error => {
                    showError(error.message || '请求失败，请稍后再试');
                })
                .finally(() => {
                    setTimeout(() => {
                        progress.style.display = 'none';
                        loadingSpinner.style.display = 'none';
                    }, 500);
                });
        });

        // 清除按钮
        clearBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInfo.style.display = 'none';
            resultJson.textContent = '';
            progress.style.display = 'none';
            errorMessage.style.display = 'none';
            invoiceDetails.innerHTML = '<div class="alert alert-info">请上传发票PDF文件并点击"解析发票"按钮查看结果</div>';
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function displayFormattedInvoice(invoice) {
            const dateString = invoice.issueDate ? new Date(invoice.issueDate).toLocaleDateString('zh-CN') : '未知';

            // Fix for invoiceType - handle both string and object formats
            let invoiceTypeDescription = '未知类型';
            if (invoice.invoiceType) {
                if (typeof invoice.invoiceType === 'object' && invoice.invoiceType.description) {
                    invoiceTypeDescription = invoice.invoiceType.description;
                } else if (typeof invoice.invoiceType === 'string') {
                    // Map the invoice type code to a description
                    const typeMap = {
                        'ELECTRONIC_NORMAL': '电子发票（普通发票）',
                        'ELECTRONIC_SPECIAL': '电子发票（增值税专用发票）',
                        'NORMAL': '普通发票',
                        'SPECIAL': '增值税专用发票',
                        'ELECTRONIC_FLIGHT': '电子发票（航空运输电子客票行程单）',
                        'AIR_PASSENGER': '货物运输',
                        'CONSTRUCTION': '建筑服务',
                        'PASSENGER_TRANSPORT': '旅客运输服务',
                        'AGRICULTURAL_PRODUCT': '自产农产品销售',
                        'RAILWAY_TICKET': '电子发票（铁路电子客票）',
                        'REAL_ESTATE_RENTAL': '不动产经营租赁服务'
                    };
                    invoiceTypeDescription = typeMap[invoice.invoiceType] || invoice.invoiceType;
                }
            }

            // 基本发票信息 - 适用于所有类型
            let basicInfo = `
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">发票信息 - ${invoiceTypeDescription}</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>发票号码:</strong> ${invoice.invoiceNumber || '未知'}</p>
                        <p><strong>开票日期:</strong> ${dateString}</p>
                        <p><strong>价税合计:</strong> ￥${invoice.totalWithTax || '0.00'}</p>
                        <p><strong>大写金额:</strong> ${invoice.amountInWords || ''}</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>合计金额:</strong> ￥${invoice.totalAmount || '0.00'}</p>
                        <p><strong>合计税额:</strong> ￥${invoice.totalTax || '0.00'}</p>
                        <p><strong>备注:</strong> ${invoice.remark || ''}</p>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-light">
                                <h6 class="mb-0">购买方信息</h6>
                            </div>
                            <div class="card-body">
                                <p><strong>名称:</strong> ${invoice.buyerName || ''}</p>
                                <p><strong>纳税人识别号:</strong> ${invoice.buyerTaxId || ''}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-light">
                                <h6 class="mb-0">销售方信息</h6>
                            </div>
                            <div class="card-body">
                                <p><strong>名称:</strong> ${invoice.sellerName || ''}</p>
                                <p><strong>纳税人识别号:</strong> ${invoice.sellerTaxId || ''}</p>
                            </div>
                        </div>
                    </div>
                </div>
    `;

            // 根据发票类型显示不同的明细表格
            let itemsHtml = '';

            if (invoice.items && invoice.items.length > 0) {
                // 根据发票类型和项目特征选择不同的表格模板
                if (invoiceTypeDescription.includes('航空运输电子客票行程单') ||
                    (invoice.items[0].flightNumber && invoice.items[0].departureAirport)) {
                    itemsHtml = generateAirTicketTable(invoice.items);
                } else if (invoiceTypeDescription.includes('货物运输') ||
                    (invoice.items[0].transportMode && invoice.items[0].origin)) {
                    itemsHtml = generateFreightTransportTable(invoice.items);
                } else if (invoiceTypeDescription.includes('建筑服务') ||
                    (invoice.items[0].projectName && invoice.items[0].projectLocation)) {
                    itemsHtml = generateConstructionServiceTable(invoice.items);
                } else if (invoiceTypeDescription.includes('旅客运输服务') ||
                    (invoice.items[0].travelDate && invoice.items[0].seatClass)) {
                    itemsHtml = generatePassengerTransportTable(invoice.items);
                } else if (invoiceTypeDescription.includes('自产农产品销售') ||
                    (invoice.items[0].productCategory && invoice.items[0].farmerName)) {
                    itemsHtml = generateAgriculturalProductTable(invoice.items);
                } else if (invoiceTypeDescription.includes('铁路电子客票') ||
                    (invoice.items[0].trainNumber && invoice.items[0].departureStation)) {
                    itemsHtml = generateRailwayTicketTable(invoice.items);
                } else if (invoiceTypeDescription.includes('不动产经营租赁服务') ||
                    (invoice.items[0].propertyAddress && invoice.items[0].leasePeriod)) {
                    itemsHtml = generatePropertyLeasingTable(invoice.items);
                } else {
                    // 默认表格 - 适用于增值税专用发票、普通发票、电子发票等
                    itemsHtml = generateStandardInvoiceTable(invoice.items);
                }
            } else {
                itemsHtml = '<p>无明细信息</p>';
            }

            // 完成发票详情HTML
            invoiceDetails.innerHTML = `
        ${basicInfo}
        <h5 class="mt-4">发票明细</h5>
        ${itemsHtml}
        </div>
    </div>
    `;
        }


        // 标准发票表格（增值税专用发票、普通发票、电子发票等）
        function generateStandardInvoiceTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>项目名称</th>
                                <th>规格型号</th>
                                <th>单位</th>
                                <th>数量</th>
                                <th>单价</th>
                                <th>金额</th>
                                <th>税率</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || ''}</td>
                                    <td>${item.specification || ''}</td>
                                    <td>${item.unit || ''}</td>
                                    <td>${item.quantity || ''}</td>
                                    <td>${item.unitPrice || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.taxRate || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 航空运输电子客票行程单
        function generateAirTicketTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>航班号</th>
                                <th>出发日期</th>
                                <th>出发时间</th>
                                <th>出发机场</th>
                                <th>到达机场</th>
                                <th>乘客姓名</th>
                                <th>座位号</th>
                                <th>金额</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.flightNumber || ''}</td>
                                    <td>${item.departureDate ? new Date(item.departureDate).toLocaleDateString('zh-CN') : ''}</td>
                                    <td>${item.departureTime || ''}</td>
                                    <td>${item.departureAirport || ''}</td>
                                    <td>${item.arrivalAirport || ''}</td>
                                    <td>${item.passengerName || ''}</td>
                                    <td>${item.seatNumber || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 货物运输服务
        function generateFreightTransportTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>项目名称</th>
                                <th>运输方式</th>
                                <th>起运地</th>
                                <th>目的地</th>
                                <th>承运人</th>
                                <th>运输工具编号</th>
                                <th>运单号</th>
                                <th>金额</th>
                                <th>税率</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || ''}</td>
                                    <td>${item.transportMode || ''}</td>
                                    <td>${item.origin || ''}</td>
                                    <td>${item.destination || ''}</td>
                                    <td>${item.carrier || ''}</td>
                                    <td>${item.vehicleNumber || ''}</td>
                                    <td>${item.waybillNumber || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.taxRate || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 建筑服务
        function generateConstructionServiceTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>项目名称</th>
                                <th>项目地点</th>
                                <th>施工日期</th>
                                <th>合同金额</th>
                                <th>合同编号</th>
                                <th>施工单位</th>
                                <th>金额</th>
                                <th>税率</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.projectName || item.name || ''}</td>
                                    <td>${item.projectLocation || ''}</td>
                                    <td>${item.constructionDate ? new Date(item.constructionDate).toLocaleDateString('zh-CN') : ''}</td>
                                    <td>${item.contractAmount || ''}</td>
                                    <td>${item.contractNumber || ''}</td>
                                    <td>${item.constructionCompany || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.taxRate || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 旅客运输服务
        function generatePassengerTransportTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>项目名称</th>
                                <th>出行日期</th>
                                <th>座席类别</th>
                                <th>起点</th>
                                <th>终点</th>
                                <th>乘客姓名</th>
                                <th>金额</th>
                                <th>税率</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || ''}</td>
                                    <td>${item.travelDate || ''}</td>
                                    <td>${item.seatClass || ''}</td>
                                    <td>${item.origin || ''}</td>
                                    <td>${item.destination || ''}</td>
                                    <td>${item.passengerName || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.taxRate || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 自产农产品销售
        function generateAgriculturalProductTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>农产品名称</th>
                                <th>农产品类别</th>
                                <th>收获日期</th>
                                <th>农户名称</th>
                                <th>生产方式</th>
                                <th>数量</th>
                                <th>单位</th>
                                <th>单价</th>
                                <th>金额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || ''}</td>
                                    <td>${item.productCategory || ''}</td>
                                    <td>${item.harvestDate ? new Date(item.harvestDate).toLocaleDateString('zh-CN') : ''}</td>
                                    <td>${item.farmerName || ''}</td>
                                    <td>${item.productionMethod || ''}</td>
                                    <td>${item.quantity || ''}</td>
                                    <td>${item.unit || ''}</td>
                                    <td>${item.unitPrice || ''}</td>
                                    <td>${item.amount || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 铁路电子客票
        function generateRailwayTicketTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>车次</th>
                                <th>出发站</th>
                                <th>到达站</th>
                                <th>出发日期</th>
                                <th>乘客姓名</th>
                                <th>身份证号码</th>
                                <th>票号</th>
                                <th>座席类别</th>
                                <th>金额</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.trainNumber || ''}</td>
                                    <td>${item.departureStation || ''}</td>
                                    <td>${item.arrivalStation || ''}</td>
                                    <td>${item.departureDate ? new Date(item.departureDate).toLocaleDateString('zh-CN') : ''}</td>
                                    <td>${item.passengerName || ''}</td>
                                    <td>${item.idNo || ''}</td>
                                    <td>${item.ticketNumber || ''}</td>
                                    <td>${item.seatClass || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 不动产经营租赁服务
        function generatePropertyLeasingTable(items) {
            return `
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>项目名称</th>
                                <th>不动产地址</th>
                                <th>租赁期限</th>
                                <th>承租方</th>
                                <th>出租方</th>
                                <th>金额</th>
                                <th>税率</th>
                                <th>税额</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || ''}</td>
                                    <td>${item.propertyAddress || ''}</td>
                                    <td>${item.leasePeriod || ''}</td>
                                    <td>${item.tenantName || ''}</td>
                                    <td>${item.lesseeName || ''}</td>
                                    <td>${item.amount || ''}</td>
                                    <td>${item.taxRate || ''}</td>
                                    <td>${item.tax || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    });
</script>
