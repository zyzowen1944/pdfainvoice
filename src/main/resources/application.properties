#aop auth
# API 鉴权配置
# 跳过验证的路径列表，用逗号分隔
api.auth.skipAuthPaths=/api/public,/health,/swagger-ui
# 客户端ID和对应的公钥配置
# 格式为: api.auth.clientPublicKeys.{clientId}={publicKey}
api.auth.clientPublicKeys.client1=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA
#api.auth.clientPublicKeys.client2=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA

# 请求时间戳有效期（毫秒）
api.auth.timestampValidityMillis=300000
# 签名算法配置
api.auth.signatureAlgorithm=SHA256withRSA
